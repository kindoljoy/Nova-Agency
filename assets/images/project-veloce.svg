<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <rect width="1200" height="800" fill="#111111"/>
  <defs>
    <radialGradient id="vel-rad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FF5A1F" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#111111" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#vel-rad)"/>
  <!-- Futuristic telemetry circles -->
  <circle cx="600" cy="400" r="260" stroke="#262626" stroke-width="2"/>
  <circle cx="600" cy="400" r="220" stroke="#FF5A1F" stroke-width="3" stroke-dasharray="120 40 200 60"/>
  <circle cx="600" cy="400" r="160" stroke="#333333" stroke-width="1" stroke-dasharray="8 8"/>
  <text x="600" y="380" font-family="'Space Grotesk', sans-serif" font-size="80" font-weight="900" fill="#F5F3EF" text-anchor="middle" letter-spacing="-0.02em">VELOCE</text>
  <text x="600" y="430" font-family="'Space Mono', monospace" font-size="16" fill="#FF5A1F" text-anchor="middle" letter-spacing="0.25em">MODEL-X SUPERBIKE // 0-100 IN 2.1s</text>
  <!-- Telemetry badges -->
  <rect x="250" y="600" width="180" height="60" rx="4" fill="#1C1C1C" stroke="#333333"/>
  <text x="270" y="625" font-family="'Space Mono', monospace" font-size="10" fill="#777777">MAX TORQUE</text>
  <text x="270" y="647" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">240 Nm</text>

  <rect x="770" y="600" width="180" height="60" rx="4" fill="#1C1C1C" stroke="#333333"/>
  <text x="790" y="625" font-family="'Space Mono', monospace" font-size="10" fill="#777777">RANGE (CITY)</text>
  <text x="790" y="647" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">380 KM</text>
</svg>
